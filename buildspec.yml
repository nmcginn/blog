version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install
  build:
    commands:
      - scripts/build.js
      - aws s3 cp site/ s3://nmcginn.com/ --recursive
      - aws s3 cp assets/static/mcginn-1985-dissertation.html s3://nmcginn.com/dissertation/index.html